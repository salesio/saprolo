<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | SAPROLO Procurement & Logistics</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="contact">
<div id="header"></div>
<section class="page-hero"><div class="container"><span class="tag" style="color:var(--lime)" data-i18n="ct_tag">Contact</span><h1 data-i18n="ct_h1">Let's talk logistics</h1><p data-i18n="ct_bc">Home › Contact</p></div></section>

<section class="pad"><div class="container split" style="align-items:start">
  <div class="reveal">
    <span class="tag" data-i18n="ct_get_tag">Get in touch</span>
    <h2 style="font-size:2.3rem;margin-bottom:1.5rem" data-i18n="ct_get_h2">We reply within one business day</h2>
    <div class="grid" style="gap:1rem">
      <div class="info-card">
        <div class="ic flag" aria-hidden="true">
          <svg viewBox="0 0 36 24"><rect width="36" height="12" fill="#E03C31"/><rect y="12" width="36" height="12" fill="#001489"/><path d="M0,0 L16,12 L0,24 Z" fill="#000"/><path d="M0,2.5 L12.5,12 L0,21.5" fill="none" stroke="#FFB81C" stroke-width="2.5"/><path d="M0,0 L14,12 L0,24 M13,12 H36" fill="none" stroke="#fff" stroke-width="6.5"/><path d="M0,0 L14,12 L0,24 M13,12 H36" fill="none" stroke="#007749" stroke-width="4"/></svg>
        </div>
        <div><b data-i18n="country_za">South Africa</b><br><span style="color:var(--muted)">128 11th Street, Parkmore, Sandton, Johannesburg, 2196</span></div>
      </div>
      <div class="info-card">
        <div class="ic flag" aria-hidden="true">
          <svg viewBox="0 0 36 24"><rect width="36" height="8" fill="#007168"/><rect y="8" width="36" height="8" fill="#000"/><rect y="16" width="36" height="8" fill="#FCE100"/><rect y="7" width="36" height="1.5" fill="#fff"/><rect y="15.5" width="36" height="1.5" fill="#fff"/><polygon points="0,0 16,12 0,24" fill="#D21034"/><polygon points="5.5,7.5 6.6,10.8 10,10.8 7.2,12.8 8.3,16 5.5,14 2.7,16 3.8,12.8 1,10.8 4.4,10.8" fill="#FCE100"/></svg>
        </div>
        <div><b data-i18n="country_mz">Mozambique</b><br><span style="color:var(--muted)" data-i18n="city_maputo">Maputo, Mozambique</span></div>
      </div>
      <div class="info-card">
        <div class="ic" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <div><b data-i18n="ct_phone_lbl">Phone / WhatsApp</b><br><span style="color:var(--muted)"><a href="tel:+27717629659">(+27) 71 762 9659</a> / <a href="tel:+27115348554">(011) 534 8554</a></span></div>
      </div>
      <div class="info-card">
        <div class="ic" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>

        <div><b data-i18n="ct_email_lbl">Email</b><br><a href="mailto:info@saprolo.co.za" style="color:var(--muted)">info@saprolo.co.za</a></div>
      </div>
    </div>
  </div>
  <form class="form-card reveal" id="contactForm">
    <h3 style="margin-bottom:1.2rem" data-i18n="cf_title">Send a message</h3>
    <div class="row r2"><div class="f"><label for="f-name" data-i18n="cf_name">Name</label><input id="f-name" name="name" required></div><div class="f"><label for="f-phone" data-i18n="cf_phone">Phone</label><input id="f-phone" name="phone" type="tel"></div></div>
    <div class="row"><div class="f"><label for="f-email" data-i18n="cf_email">Email</label><input id="f-email" name="email" type="email" required></div></div>
    <div class="row"><div class="f"><label for="f-service" data-i18n="cf_service">Service</label><select id="f-service" name="service"><option data-i18n="cf_opt1">Logistics / Freight</option><option data-i18n="cf_opt2">Sourcing</option><option data-i18n="cf_opt3">Supply / Procurement</option><option data-i18n="cf_opt4">Delivery</option></select></div></div>
    <div class="row"><div class="f"><label for="msg" data-i18n="cf_msg">Message</label><textarea id="msg" name="msg" rows="5" required></textarea></div></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" data-i18n="cf_btn">Send Message</button>
  </form>
</div></section>
<div id="footer"></div>
<script src="assets/main.js"></script>
</body></html>
